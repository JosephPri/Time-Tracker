<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval Chime</title>
<style>
  :root {
    --bg: #f9f8f7; --fg: #2b2a28; --muted: #7a776f; --line: #e2dfd8;
    --accent: #2f6f5e; --accent-fg: #fff; --field: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #383836; --fg: #ece9e2; --muted: #a29e95; --line: #53524f;
      --accent: #6cc2a8; --accent-fg: #10231d; --field: #2f2f2d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
    padding: 4px 22px 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .clock { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-radius: 6px; }
  .left { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .time {
    font-size: 32px; line-height: 1; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .time small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  body.running .time small { color: var(--accent); }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; line-height: 1.3; white-space: nowrap; }
  body.running .count { color: var(--accent); }
  .row { display: flex; gap: 5px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 1px; color: var(--muted); font-size: 11px; line-height: 1.3; flex: 1 1 0; min-width: 0; }
  input, select {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; width: 100%;
  }
  input[type=range] { padding: 0; height: 24px; margin: 0; accent-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 5px;
    border: 1px solid var(--line); background: var(--field); color: var(--fg); padding: 4px 10px;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #toggle { min-width: 64px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="left">
      <div class="time" id="time">--:--</div>
    </div>
    <div class="right">
      <div class="count" id="count">Off</div>
    </div>
  </div>

  <div class="row">
    <label>Every (min)
      <select id="interval">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="60">60</option>
      </select>
    </label>
    <label>Start at min
      <!-- max is a loose upper bound here; the script tightens it to (interval - 1) -->
      <input id="offset" type="number" min="0" max="59" value="0" inputmode="numeric">
    </label>
    <label>Sound
      <select id="sound">
        <option value="chime">Chime</option>
        <option value="bell">Bell</option>
        <option value="beep">Beep</option>
        <option value="double">Double beep</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>Volume
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.6">
    </label>
    <button id="test" type="button">Test</button>
    <button id="toggle" type="button" class="primary">Start</button>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var els = { interval: $('interval'), offset: $('offset'), sound: $('sound'), volume: $('volume'),
              time: $('time'), count: $('count'), toggle: $('toggle'), test: $('test'), clock: $('clock') };
  var KEY = 'interval-chime-settings';
  var FACTORS = [5, 10, 15, 20, 30, 60];
  var LOOKAHEAD = 2500;   // ms before an alarm at which its sound is pre-scheduled on the audio clock
  var GRACE = 20000;      // ms: ring late (instead of skipping) if we were throttled by less than this
  var running = false, nextAt = 0, scheduledFor = 0, ctx = null, pending = [];
  var lastTick = Date.now(), usingWorker = false;  // If time jumps forward by more than this between ticks, the device was asleep.
  // Worker ticks every 250ms, so 5s is safe; the setInterval fallback can be throttled to ~1/min in hidden tabs.
  function sleepGap() { return usingWorker ? 5000 : 70000; }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        interval: els.interval.value, offset: els.offset.value,
        sound: els.sound.value, volume: els.volume.value
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s) return;
      if (FACTORS.indexOf(parseInt(s.interval, 10)) !== -1) els.interval.value = s.interval;
      els.offset.value = s.offset;
      els.sound.value = s.sound; els.volume.value = s.volume;
    } catch (e) {}
  }

  function getInterval() {
    var n = parseInt(els.interval.value, 10);
    return FACTORS.indexOf(n) === -1 ? 10 : n;
  }
  function getOffset() {
    var o = parseInt(els.offset.value, 10) || 0;
    return Math.max(0, Math.min(getInterval() - 1, o));
  }
  function syncOffsetLimit() {
    els.offset.max = getInterval() - 1;
    if ((parseInt(els.offset.value, 10) || 0) > getInterval() - 1) els.offset.value = getInterval() - 1;
  }

  // Alarms land on clock-aligned marks: offset, offset+N, offset+2N ... minutes after midnight
  function computeNext(from) {
    var d = new Date(from); d.setHours(0, 0, 0, 0);
    var mid = d.getTime(), step = getInterval() * 60000, off = getOffset() * 60000;
    var n = Math.floor((from - mid - off) / step) + 1;
    return mid + off + n * step;
  }

  function fmtCount(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0') + ' left';
  }

  // ---- Sound (generated with Web Audio) ----
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // `start` is seconds from now on the audio clock, so a chime can be queued ahead of time
  function tone(freq, start, dur, type, gain) {
    var c = audio(), o = c.createOscillator(), g = c.createGain();
    var vol = parseFloat(els.volume.value) * gain;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
    pending.push(o);
    o.onended = function () { var i = pending.indexOf(o); if (i !== -1) pending.splice(i, 1); };
  }
  function cancelPending() {
    pending.slice().forEach(function (o) { try { o.stop(); } catch (e) {} });
    pending = []; scheduledFor = 0;
  }
  function play(delay) {
    var d = delay || 0;
    switch (els.sound.value) {
      case 'bell':
        tone(660, d, 2.2, 'sine', 0.8); tone(1320, d, 1.6, 'sine', 0.3); tone(1980, d, 1.0, 'sine', 0.15); break;
      case 'beep':
        tone(880, d, 0.35, 'square', 0.25); break;
      case 'double':
        tone(880, d, 0.18, 'square', 0.25); tone(880, d + 0.28, 0.18, 'square', 0.25); break;
      default:
        tone(523.25, d, 1.2, 'sine', 0.7); tone(659.25, d + 0.18, 1.2, 'sine', 0.7); tone(783.99, d + 0.36, 1.6, 'sine', 0.7);
    }
  }

  // ---- Loop ----
  function tick() {
    var now = Date.now(), d = new Date(now);
    var h = d.getHours() % 12 || 12, m = String(d.getMinutes()).padStart(2, '0'), s = String(d.getSeconds()).padStart(2, '0');
    els.time.innerHTML = h + ':' + m + '<small>' + s + '</small>';

    var prev = lastTick, gap = now - prev;
    lastTick = now;
    if (!running) return;

    // Woke from sleep: turn off so the user has to restart it deliberately
    if (gap > sleepGap()) { stopForSleep(); return; }

    // Pre-schedule the sound on the audio clock just before the mark, so a throttled
    // timer in a background tab can't make it late.
    var until = nextAt - now;
    if (until > 0 && until <= LOOKAHEAD && scheduledFor !== nextAt) {
      play(until / 1000);
      scheduledFor = nextAt;
    }

    if (now >= nextAt) {
      if (scheduledFor === nextAt) {
        // already queued on the audio clock; nothing more to do
      } else if (now - nextAt < GRACE) {
        play(); // timer was throttled past the mark, but not by much: ring now
      } else {
        stopForSleep(); // missed the mark by a long way (sleep): turn off
        return;
      }
      nextAt = computeNext(now);
      scheduledFor = 0;
    }
    els.count.textContent = fmtCount(nextAt - now);
  }

  // Timer source: a Web Worker is not subject to the heavy throttling that hidden-tab
  // setInterval gets. Falls back to setInterval if workers/blobs are blocked (e.g. some embeds).
  function startTimer() {
    try {
      var src = 'setInterval(function(){postMessage(0)},250)';
      var w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      usingWorker = true;
      w.onmessage = tick;
      w.onerror = function () { w.terminate(); usingWorker = false; setInterval(tick, 250); };
    } catch (e) {
      usingWorker = false;
      setInterval(tick, 250);
    }
  }

  function stopForSleep() {
    stop();
    els.count.textContent = 'Stopped after sleep';
  }

  function start() {
    audio(); // created from a click so the browser allows sound
    running = true;
    lastTick = Date.now();
    scheduledFor = 0;
    nextAt = computeNext(Date.now());
    els.toggle.textContent = 'Stop';
    document.body.classList.add('running');
    tick();
  }
  function stop() {
    running = false;
    cancelPending();
    els.count.textContent = 'Off'; els.toggle.textContent = 'Start';
    document.body.classList.remove('running');
  }

  els.toggle.addEventListener('click', function () { running ? stop() : start(); });
  els.test.addEventListener('click', function () { play(); });
  ['interval', 'offset', 'sound', 'volume'].forEach(function (k) {
    els[k].addEventListener('input', function () {
      if (k === 'interval') syncOffsetLimit();
      if (running && (k === 'interval' || k === 'offset' || k === 'sound')) {
        cancelPending(); // drop any chime queued for the old schedule/sound
        nextAt = computeNext(Date.now());
      }
      save();
    });
  });

  // Catch up immediately when the tab/embed becomes visible again
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { if (ctx && ctx.state === 'suspended') ctx.resume(); tick(); }
  });

  load(); syncOffsetLimit();
  startTimer(); tick();
})();
</script>
</body>
</html>
