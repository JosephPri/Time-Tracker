<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval Chime</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #2b2a28; --muted: #7a776f; --line: #e2dfd8;
    --accent: #2f6f5e; --accent-fg: #fff; --field: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --fg: #ece9e2; --muted: #8f8b82; --line: #333;
      --accent: #6cc2a8; --accent-fg: #10231d; --field: #232323;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
    padding: 18px 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .clock { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .next {
    font: 600 44px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .next.off { color: var(--muted); }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  input, select {
    font: inherit; color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  .grow { flex: 1 1 110px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--line); background: var(--field); color: var(--fg); padding: 8px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1 1 120px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 35%, transparent); } 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="next off" id="next">--:--</div>
    <div class="count" id="count">Stopped</div>
  </div>

  <div class="row">
    <label class="grow">Every (minutes)
      <select id="interval">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="10" selected>10</option>
        <option value="12">12</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="60">60</option>
      </select>
    </label>
    <label class="grow">Start at minute
      <input id="offset" type="number" min="0" max="59" value="0" inputmode="numeric">
    </label>
    <label class="grow">Sound
      <select id="sound">
        <option value="chime">Chime</option>
        <option value="bell">Bell</option>
        <option value="beep">Beep</option>
        <option value="double">Double beep</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label class="grow">Volume
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.6">
    </label>
    <button id="test" type="button">Test</button>
    <button id="toggle" type="button" class="primary">Start</button>
  </div>

  <p class="hint" id="hint"></p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var els = { interval: $('interval'), offset: $('offset'), sound: $('sound'), volume: $('volume'),
              next: $('next'), count: $('count'), toggle: $('toggle'), test: $('test'),
              hint: $('hint'), clock: $('clock') };
  var KEY = 'interval-chime-settings';
  var running = false, nextAt = 0, timer = null, ctx = null;

  // Settings persistence (may be unavailable inside some embeds)
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        interval: els.interval.value, offset: els.offset.value,
        sound: els.sound.value, volume: els.volume.value, running: running
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s) return;
      if (FACTORS.indexOf(parseInt(s.interval, 10)) !== -1) els.interval.value = s.interval;
      els.offset.value = s.offset;
      els.sound.value = s.sound; els.volume.value = s.volume;
    } catch (e) {}
  }

  var FACTORS = [1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60];
  function getInterval() {
    var n = parseInt(els.interval.value, 10);
    return FACTORS.indexOf(n) === -1 ? 10 : n;
  }
  // Offset only makes sense within one interval (e.g. every 10 min: 0-9)
  function getOffset() {
    var o = parseInt(els.offset.value, 10) || 0;
    return Math.max(0, Math.min(getInterval() - 1, o));
  }
  function syncOffsetLimit() {
    els.offset.max = getInterval() - 1;
    if ((parseInt(els.offset.value, 10) || 0) > getInterval() - 1) els.offset.value = getInterval() - 1;
  }

  // Next alarm lands on clock-aligned marks: offset, offset+N, offset+2N ... minutes after midnight
  function computeNext(from) {
    var d = new Date(from); d.setHours(0, 0, 0, 0);
    var mid = d.getTime(), step = getInterval() * 60000, off = getOffset() * 60000;
    var n = Math.floor((from - mid - off) / step) + 1;
    return mid + off + n * step;
  }

  function fmt(t) {
    var d = new Date(t);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function fmtCount(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0') + ' left';
  }

  function updateHint() {
    var n = getInterval(), o = getOffset();
    var marks = [], t = computeNext(Date.now()), i;
    for (i = 0; i < 4; i++) { marks.push(fmt(t)); t += n * 60000; }
    els.hint.textContent = 'Rings at ' + marks.join(', ') + '\u2026';
  }

  // ---- Sound (generated with Web Audio, no files needed) ----
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type, gain) {
    var c = audio(), o = c.createOscillator(), g = c.createGain();
    var vol = parseFloat(els.volume.value) * gain;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  function play() {
    switch (els.sound.value) {
      case 'bell':
        tone(660, 0, 2.2, 'sine', 0.8); tone(1320, 0, 1.6, 'sine', 0.3); tone(1980, 0, 1.0, 'sine', 0.15); break;
      case 'beep':
        tone(880, 0, 0.35, 'square', 0.25); break;
      case 'double':
        tone(880, 0, 0.18, 'square', 0.25); tone(880, 0.28, 0.18, 'square', 0.25); break;
      default:
        tone(523.25, 0, 1.2, 'sine', 0.7); tone(659.25, 0.18, 1.2, 'sine', 0.7); tone(783.99, 0.36, 1.6, 'sine', 0.7);
    }
  }

  // ---- Loop ----
  function tick() {
    if (!running) return;
    var now = Date.now();
    if (now >= nextAt) {
      // Only ring if on time. If we're way past due (laptop slept, tab was
      // frozen), skip the sound and just reschedule.
      if (now - nextAt < 3000) {
        play();
        els.clock.classList.remove('flash'); void els.clock.offsetWidth; els.clock.classList.add('flash');
      }
      nextAt = computeNext(now);
      els.next.textContent = fmt(nextAt);
      updateHint();
    }
    els.count.textContent = fmtCount(nextAt - now);
  }

  function start() {
    audio(); // must be created from a click so the browser allows sound
    running = true;
    nextAt = computeNext(Date.now());
    els.next.textContent = fmt(nextAt); els.next.classList.remove('off');
    els.toggle.textContent = 'Stop';
    clearInterval(timer); timer = setInterval(tick, 250);
    tick(); updateHint(); save();
  }
  function stop() {
    running = false; clearInterval(timer);
    els.next.textContent = '--:--'; els.next.classList.add('off');
    els.count.textContent = 'Stopped'; els.toggle.textContent = 'Start';
    updateHint(); save();
  }

  els.toggle.addEventListener('click', function () { running ? stop() : start(); });
  els.test.addEventListener('click', play);
  ['interval', 'offset', 'sound', 'volume'].forEach(function (k) {
    els[k].addEventListener('input', function () {
      if (k === 'interval') syncOffsetLimit();
      if (running && (k === 'interval' || k === 'offset')) {
        nextAt = computeNext(Date.now()); els.next.textContent = fmt(nextAt);
      }
      updateHint(); save();
    });
  });

  load(); syncOffsetLimit(); updateHint();
})();
</script>
</body>
</html>
